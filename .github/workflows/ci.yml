name: Matrix CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      # fail-fast is false so that one failing combination doesn't cancel the others, giving us full visibility
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
        include:
          - os: ubuntu-latest
            node: 24
            experimental: true
          - os: windows-latest
            node: 24
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - name: Print environment info for debugging
        shell: bash
        run: |
          node --version
          npm --version
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        shell: bash
      - run: npm test
        shell: bash
