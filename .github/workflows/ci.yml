name: Matrix CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} | Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Run every matrix combination even if one fails.
      # This helps identify all compatibility issues across environments.
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        node:
          - 18
          - 20
          - 22

        include:
          - os: ubuntu-latest
            node: 24
            experimental: true

    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Print environment information
        run: |
          echo "Operating System: ${{ runner.os }}"
          echo "Node Version:"
          node --version
          echo "NPM Version:"
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test